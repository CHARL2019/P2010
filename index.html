<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de vol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("carnet-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#e9edf0;--paper:#fafbfa;--ink:#12263a;--mute:#5f7183;--rule:#cdd6dc;--acc:#1f5fa8;--on-acc:#fff;--stamp:#c8362b;--ok:#1d7a4b;--field:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#0c1219;--paper:#131b24;--ink:#e7edf2;--mute:#8b9cad;--rule:#25323f;--acc:#6bb2ff;--on-acc:#071522;--stamp:#ff7a6e;--ok:#4cd08a;--field:#0e151d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Archivo","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.05rem}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
button.ghost{border-color:transparent;background:none;padding:4px 8px;color:var(--mute);font-weight:500}
button.ghost:hover{color:var(--acc)}button.ghost.del:hover{color:var(--stamp)}
.sp{flex:1}

/* barre du haut */
.top{display:flex;align-items:center;gap:10px;padding:16px 0}
.top h1{font-size:1.25rem;font-variation-settings:"wdth" 110}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:600}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:6px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu .pop button{border:0;background:none;text-align:left;border-radius:4px}
.menu .pop button:hover{background:var(--bg)}

/* compteur horaire */
.hero{display:grid;grid-template-columns:5fr 7fr;gap:0;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.hobbs{padding:26px 28px;border-right:1px solid var(--rule)}
.hobbs .cap{color:var(--mute);margin:0 0 12px}
.odo{display:inline-flex;align-items:center;gap:4px;padding:10px;background:#0a0f14;border:2px solid #3b4756;border-radius:8px;box-shadow:inset 0 2px 8px #000}
.odo span{display:inline-flex;align-items:center;justify-content:center;width:42px;height:62px;background:linear-gradient(#10161d,#05080b 50%,#10161d);border-radius:4px;color:#f3f6f9;font:700 2.5rem/1 "Archivo",sans-serif;font-variation-settings:"wdth" 80}
.odo span.m{color:#ffb547}
.odo i{font-style:normal;color:#ffb547;font-size:2rem;font-weight:700;padding:0 2px}
.boot .odo span{animation:roll .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms)}
@keyframes roll{from{transform:translateY(-55%);opacity:0}to{transform:none;opacity:1}}
.lede{margin:14px 0 18px;color:var(--mute);max-width:36ch}
.lede b{color:var(--ink)}
.months{padding:22px 24px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:14px;border-bottom:1px solid var(--rule)}
.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.72rem;color:var(--mute);position:relative}
.chart b{display:block;width:100%;background:var(--acc);opacity:.45;border-radius:3px 3px 0 0;min-height:2px}
.chart .now b{opacity:1}
.chart span{margin-bottom:3px}
.chartx{display:flex;gap:6px;font-size:.72rem;color:var(--mute);margin-top:4px}
.chartx span{flex:1;text-align:center}

/* bandeau de synthèse */
.strip{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.strip>div{padding:18px 20px;border-right:1px solid var(--rule)}.strip>div:last-child{border:0}
.strip h3{font-size:.95rem;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.bar2{height:5px;background:var(--rule);border-radius:3px;margin:2px 0 8px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc)}
.dots{display:flex;gap:5px;margin:4px 0 2px}.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--rule)}.dots i.on{background:var(--ok);border-color:var(--ok)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--stamp);font-weight:700}
.mute{color:var(--mute);font-size:.85rem}

/* registre */
.ledger{background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.lhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.lhead input,.lhead select{width:auto;flex:1;min-width:150px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;width:100%}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:780px}
th{font-weight:700;font-size:.82rem;color:var(--mute);text-align:left;padding:10px 14px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th.r,td.r{text-align:right}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.route{font-weight:700;white-space:nowrap}
.sub{color:var(--mute);font-size:.82rem}
.dur{font-weight:800;white-space:nowrap}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:0 8px;border:1px solid var(--rule);border-radius:99px;margin:0 4px 2px 0;white-space:nowrap}
.tag.pic{background:var(--ink);border-color:var(--ink);color:var(--paper)}
tfoot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;background:var(--bg)}
.empty{padding:44px 20px;text-align:center}
.empty p{margin:0 0 14px;color:var(--mute)}

/* formulaire */
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);padding:0;width:min(580px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(5,10,16,.6)}
dialog form{padding:22px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.f label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
.f .full{grid-column:1/-1}.f .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}.f .chk input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.foot{color:var(--mute);font-size:.82rem;padding:18px 0 40px}

@media(max-width:860px){
  .hero{grid-template-columns:1fr}.hobbs{border-right:0;border-bottom:1px solid var(--rule)}
  .strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(2){border-right:0}.strip>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}
@media(max-width:720px){
  .odo span{width:34px;height:52px;font-size:2rem}
  table{min-width:0}thead{display:none}
  tbody tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
  td{display:block;border:0;padding:0}td.r{text-align:left}
  td.t{grid-column:2;grid-row:1;text-align:right}td.d{grid-column:1;grid-row:1}
  td.m,td.x,td.rt,td.a,td.f{grid-column:1/-1}
  tfoot tr{display:flex;justify-content:space-between;padding:12px 14px}tfoot td{background:none;border:0;padding:0}tfoot td.skip{display:none}
}
@media print{.top .menu,#add,.lhead,td.x,th.x,.foot{display:none}body{background:#fff}.hero,.strip,.ledger{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="boot">
<div class="wrap">
  <header class="top">
    <h1>Carnet de vol</h1><span class="sp"></span>
    <button id="thm" aria-label="Changer de thème">Thème</button>
    <details class="menu"><summary>Données</summary><div class="pop">
      <button id="csv">Exporter en CSV</button><button id="bak">Sauvegarde JSON</button><button id="imp">Importer une sauvegarde</button><button id="prt">Imprimer le carnet</button>
    </div></details>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </header>

  <section class="hero" aria-label="Total des heures de vol">
    <div class="hobbs">
      <p class="cap">Heures de vol au total</p>
      <div class="odo" id="odo" aria-live="polite"></div>
      <p class="lede" id="lede"></p>
      <button class="primary" id="add">Ajouter un vol</button>
    </div>
    <div class="months"><h2>Heures par mois, sur 12 mois</h2><div class="chart" id="chart"></div><div class="chartx" id="chartx"></div></div>
  </section>

  <section class="strip" id="strip"></section>

  <section class="ledger">
    <div class="lhead">
      <input type="search" id="q" placeholder="Rechercher un aérodrome, une immatriculation…" aria-label="Rechercher">
      <select id="fr" aria-label="Filtrer par fonction"><option value="">Toutes les fonctions</option></select>
      <select id="fa" aria-label="Filtrer par appareil"><option value="">Tous les appareils</option></select>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Date</th><th>Trajet</th><th>Appareil</th><th>Fonction</th><th class="r">Durée</th><th class="r">Att.</th><th>Remarques</th><th class="x"></th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="tot"></tfoot>
    </table></div>
    <div class="empty" id="empty" hidden></div>
  </section>
  <p class="foot">Vos vols sont enregistrés dans ce navigateur, sur cet appareil. Faites une sauvegarde JSON de temps en temps.</p>
</div>

<dialog id="dlg"><form id="frm">
  <h2 id="dt">Nouveau vol</h2>
  <div class="f">
    <label>Date<input type="date" id="date" required></label>
    <label>Durée (hh:mm)<input id="dur" required placeholder="1:30" inputmode="numeric"></label>
    <label>Départ (OACI)<input id="dep" required maxlength="4" placeholder="LFPN" style="text-transform:uppercase"></label>
    <label>Arrivée (OACI)<input id="arr" required maxlength="4" placeholder="LFPT" style="text-transform:uppercase"></label>
    <label>Type d’appareil<input id="type" required list="types" placeholder="DR400, C172, P2010…"></label>
    <label>Immatriculation<input id="reg" placeholder="F-GABC" style="text-transform:uppercase"></label>
    <label>Fonction<select id="role"><option value="CDB">Commandant de bord</option><option value="COPI">Copilote</option><option value="DC">Double commande (élève)</option><option value="INST">Instructeur</option></select></label>
    <label>Atterrissages<input type="number" id="ldg" min="0" value="1"></label>
    <label class="chk"><input type="checkbox" id="night"> Vol de nuit</label>
    <label class="chk"><input type="checkbox" id="ifr"> Vol aux instruments (IFR)</label>
    <label class="full">Remarques<textarea id="rem" rows="2" placeholder="Météo, passagers, exercices, incidents…"></textarea></label>
  </div>
  <datalist id="types"></datalist>
  <div class="acts"><button type="button" id="cancel">Annuler</button><button class="primary" type="submit">Enregistrer le vol</button></div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY="carnet-de-vol-v1";
const ROLES={CDB:"CDB",COPI:"Copilote",DC:"Double commande",INST:"Instructeur"};
const $=id=>document.getElementById(id);
let flights=[],editId=null,mem=null;

function load(){try{const r=localStorage.getItem(KEY);flights=r?JSON.parse(r):[]}catch(e){flights=mem||[]}}
function save(){mem=flights;try{localStorage.setItem(KEY,JSON.stringify(flights))}catch(e){toast("Stockage indisponible : faites une sauvegarde JSON.")}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
function parseDur(s){s=s.trim().replace(/[h,.]/i,":");const p=s.split(":");const h=parseInt(p[0],10)||0;const m=p[1]?parseInt(p[1].padEnd(2,"0").slice(0,2),10):0;return h*60+m}
const dFr=d=>d?d.split("-").reverse().join("/"):"";
const day=d=>new Date(d+"T12:00:00");
const sum=fn=>flights.filter(fn).reduce((a,f)=>a+f.mins,0);
function group(key){const o={};flights.forEach(f=>{const k=key(f)||"—";o[k]=(o[k]||0)+f.mins});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function bars(g){if(!g.length)return'<p class="mute">Rien à afficher pour l’instant.</p>';const mx=g[0][1];return g.slice(0,5).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="bar2"><i style="width:${Math.round(v/mx*100)}%"></i></div>`).join("")}

/* validité : 3 atterrissages dans les 90 derniers jours */
function currency(night){
  const d=[];flights.filter(f=>!!f.night===night).forEach(f=>{for(let i=0;i<f.ldg;i++)d.push(f.date)});
  d.sort().reverse();const now=Date.now(),lim=now-90*864e5,n=d.filter(x=>day(x).getTime()>=lim).length;
  const ok=n>=3,until=d.length>=3?new Date(day(d[2]).getTime()+90*864e5):null;
  return{n:Math.min(n,3),ok,until:ok&&until?until.toLocaleDateString("fr-FR"):null};
}
function render(){
  const t=sum(()=>true),[h,m]=fmt(t).split(":"),digits=h.padStart(4,"0")+m;
  $("odo").innerHTML=[...h.padStart(4,"0")].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("")+`<i>:</i>`+[...m].map((c,i)=>`<span class="m" style="--i:${i+4}">${c}</span>`).join("");
  const last=flights.length?[...flights].sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
  const ldg=flights.reduce((a,f)=>a+f.ldg,0);
  $("lede").innerHTML=flights.length?`<b>${flights.length}</b> vol${flights.length>1?"s":""} et <b>${ldg}</b> atterrissage${ldg>1?"s":""}. Dernier vol le <b>${dFr(last.date)}</b>, ${esc(last.dep)} → ${esc(last.arr)}.`:"Votre carnet est vide. Ajoutez votre premier vol pour démarrer le compteur.";

  const mo=[],n=new Date();
  for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);mo.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),l:d.toLocaleDateString("fr-FR",{month:"short"}).replace(".",""),v:0,now:i===0})}
  flights.forEach(f=>{const x=mo.find(o=>o.k===f.date.slice(0,7));if(x)x.v+=f.mins});
  const mx=Math.max(60,...mo.map(o=>o.v));
  $("chart").innerHTML=mo.map(o=>`<div class="${o.now?"now":""}" title="${o.l} : ${fmt(o.v)}"><span>${o.v?fmt(o.v):""}</span><b style="height:${Math.round(o.v/mx*118)}px"></b></div>`).join("");
  $("chartx").innerHTML=mo.map(o=>`<span>${o.l}</span>`).join("");

  const c1=currency(false),c2=currency(true),d30=Date.now()-30*864e5;
  const cur=(l,c)=>`<div class="line"><span>${l}</span><span class="${c.ok?"ok":"no"}">${c.ok?"Valide":"À compléter"}</span></div><div class="dots" aria-label="${c.n} sur 3">${[0,1,2].map(i=>`<i class="${i<c.n?"on":""}"></i>`).join("")}</div><div class="mute">${c.ok&&c.until?"jusqu’au "+c.until:c.n+" atterrissage"+(c.n>1?"s":"")+" sur 3, en 90 jours"}</div>`;
  $("strip").innerHTML=`<div><h3>Emport de passagers</h3>${cur("Jour",c1)}<div style="height:10px"></div>${cur("Nuit",c2)}<p class="mute" style="margin:10px 0 0">Indicatif : vérifiez la réglementation de votre licence.</p></div>
  <div><h3>Par appareil</h3>${bars(group(f=>f.type))}</div>
  <div><h3>Par fonction</h3>${bars(group(f=>ROLES[f.role]))}</div>
  <div><h3>Cumuls</h3>
    <div class="line"><span>30 derniers jours</span><b>${fmt(sum(f=>day(f.date).getTime()>=d30))}</b></div>
    <div class="line"><span>Commandant de bord</span><b>${fmt(sum(f=>f.role==="CDB"||f.role==="INST"))}</b></div>
    <div class="line"><span>Nuit</span><b>${fmt(sum(f=>f.night))}</b></div>
    <div class="line"><span>IFR</span><b>${fmt(sum(f=>f.ifr))}</b></div></div>`;

  const fa=$("fa"),cur2=fa.value,types=[...new Set(flights.map(f=>f.type))].sort();
  fa.innerHTML='<option value="">Tous les appareils</option>'+types.map(x=>`<option${x===cur2?" selected":""}>${esc(x)}</option>`).join("");
  $("types").innerHTML=types.map(x=>`<option value="${esc(x)}">`).join("");
  rows();
}
function rows(){
  const q=$("q").value.toLowerCase(),fr=$("fr").value,fa=$("fa").value;
  const L=[...flights].sort((a,b)=>b.date.localeCompare(a.date)).filter(f=>(!fr||f.role===fr)&&(!fa||f.type===fa)&&(!q||[f.dep,f.arr,f.type,f.reg,f.rem].join(" ").toLowerCase().includes(q)));
  $("rows").innerHTML=L.map(f=>`<tr><td class="d">${dFr(f.date)}</td><td class="rt route">${esc(f.dep)} → ${esc(f.arr)}</td>
  <td class="a">${esc(f.type)}<div class="sub">${esc(f.reg)}</div></td>
  <td class="f"><span class="tag${f.role==="CDB"?" pic":""}">${ROLES[f.role]}</span>${f.night?'<span class="tag">Nuit</span>':""}${f.ifr?'<span class="tag">IFR</span>':""}</td>
  <td class="r t dur">${fmt(f.mins)}</td><td class="r l">${f.ldg}</td><td class="m sub">${esc(f.rem)}</td>
  <td class="x" style="white-space:nowrap"><button class="ghost" data-e="${f.id}">Modifier</button><button class="ghost del" data-d="${f.id}">Supprimer</button></td></tr>`).join("");
  const tm=L.reduce((a,f)=>a+f.mins,0),tl=L.reduce((a,f)=>a+f.ldg,0);
  $("tot").innerHTML=L.length?`<tr><td colspan="4">${L.length} vol${L.length>1?"s":""}${(q||fr||fa)?" (filtrés)":""}</td><td class="r">${fmt(tm)}</td><td class="r">${tl}</td><td colspan="2" class="skip"></td></tr>`:"";
  const e=$("empty");
  if(!L.length){e.hidden=false;e.innerHTML=flights.length?"<p>Aucun vol ne correspond à ces filtres.</p>":'<p>Aucun vol enregistré.</p><button id="demo">Charger des vols d’exemple</button>'}else e.hidden=true;
}

function openForm(f){
  editId=f?f.id:null;$("dt").textContent=f?"Modifier le vol":"Nouveau vol";
  $("date").value=f?f.date:new Date().toISOString().slice(0,10);
  $("dur").value=f?fmt(f.mins):"";$("dep").value=f?f.dep:"";$("arr").value=f?f.arr:"";
  $("type").value=f?f.type:(flights.length?flights[flights.length-1].type:"");$("reg").value=f?f.reg:"";
  $("role").value=f?f.role:"CDB";$("ldg").value=f?f.ldg:1;$("night").checked=!!(f&&f.night);$("ifr").checked=!!(f&&f.ifr);$("rem").value=f?f.rem:"";
  $("dlg").showModal();
}
$("frm").addEventListener("submit",e=>{
  e.preventDefault();
  const mins=parseDur($("dur").value);
  if(mins<=0){toast("Saisissez une durée valide, par exemple 1:30.");return}
  const o={id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:$("date").value,mins,dep:$("dep").value.toUpperCase().trim(),arr:$("arr").value.toUpperCase().trim(),type:$("type").value.trim(),reg:$("reg").value.toUpperCase().trim(),role:$("role").value,ldg:Math.max(0,parseInt($("ldg").value)||0),night:$("night").checked,ifr:$("ifr").checked,rem:$("rem").value.trim()};
  const was=editId;if(editId)flights=flights.map(f=>f.id===editId?o:f);else flights.push(o);
  save();$("dlg").close();render();toast(was?"Vol modifié.":"Vol enregistré.");
});
$("cancel").onclick=()=>$("dlg").close();
$("add").onclick=()=>openForm();
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)openForm(flights.find(f=>f.id===b.dataset.e));
  if(b.dataset.d&&confirm("Supprimer ce vol ? Cette action est définitive.")){flights=flights.filter(f=>f.id!==b.dataset.d);save();render();toast("Vol supprimé.")}
  if(b.id==="demo")demo();
  if(!e.target.closest(".menu"))document.querySelector(".menu").open=false;
});
["q","fr","fa"].forEach(i=>$(i).addEventListener("input",rows));
$("fr").innerHTML+=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");

function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("csv").onclick=()=>{
  const H=["Date","Départ","Arrivée","Type","Immatriculation","Fonction","Durée","Minutes","Atterrissages","Nuit","IFR","Remarques"];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[...flights].sort((a,b)=>a.date.localeCompare(b.date)).map(f=>[f.date,f.dep,f.arr,f.type,f.reg,ROLES[f.role],fmt(f.mins),f.mins,f.ldg,f.night?"oui":"non",f.ifr?"oui":"non",f.rem].map(q).join(";"));
  dl("carnet-de-vol.csv","\ufeff"+[H.map(q).join(";"),...L].join("\r\n"),"text/csv");toast("CSV exporté.");
};
$("bak").onclick=()=>{dl("carnet-de-vol-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(flights,null,1),"application/json");toast("Sauvegarde exportée.")};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;
      const ids=new Set(flights.map(x=>x.id));let n=0;
      a.forEach(x=>{if(x&&x.date&&x.mins&&!ids.has(x.id)){flights.push({ldg:1,role:"CDB",rem:"",reg:"",...x,id:x.id||Date.now().toString(36)+n});n++}});
      save();render();toast(n+" vol(s) importé(s).");
    }catch(err){toast("Fichier invalide : choisissez une sauvegarde JSON de ce carnet.")}
    e.target.value="";
  };r.readAsText(f);
};
$("prt").onclick=()=>window.print();
$("thm").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("carnet-theme",t)}catch(e){}};

function demo(){
  const R=[["LFPN","LFPT","DR400","F-GABC",90,2],["LFPT","LFFU","DR400","F-GABC",75,1],["LFPN","LFPN","C172","F-HXYZ",50,4],["LFPN","LFPO","C172","F-HXYZ",65,1],["LFPN","LFAT","DR400","F-GABC",110,2]];
  for(let i=0;i<14;i++){const r=R[i%5],d=new Date(Date.now()-(i*19+3)*864e5);
    flights.push({id:"demo"+i,date:d.toISOString().slice(0,10),dep:r[0],arr:r[1],type:r[2],reg:r[3],mins:r[4],ldg:r[5],role:i%6===5?"DC":"CDB",night:i%7===3,ifr:i%9===4,rem:i%4===0?"Belle météo, vent faible":""})}
  save();render();toast("Vols d’exemple chargés.");
}
load();render();setTimeout(()=>document.body.classList.remove("boot"),1500);
</script>
</body>
</html>
